name: Build TDLib Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        echo "📦 Setting up build environment..."
        brew install cmake ninja
        echo "✅ CMake and Ninja installed"

    - name: Download Android NDK
      run: |
        echo "⬇️ Downloading Android NDK r26c..."
        cd ~
        curl -L -o android-ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-darwin.zip
        unzip -q android-ndk.zip
        echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r26c" >> $GITHUB_ENV
        echo "✅ NDK installed"

    - name: Build OpenSSL for macOS (Host)
      run: |
        echo "🔐 Building OpenSSL 3.0.15 for macOS (host tools)..."
        cd ~
        curl -L -o openssl.tar.gz https://www.openssl.org/source/openssl-3.0.15.tar.gz
        tar -xzf openssl.tar.gz

        # Build for macOS native (for host tools)
        cd openssl-3.0.15
        ./Configure darwin64-arm64-cc \
          --prefix=$HOME/openssl-macos \
          no-shared \
          no-tests

        make -j4
        make install_sw

        echo "✅ OpenSSL for macOS built"
        ls -lh $HOME/openssl-macos/lib/

    - name: Build TDLib Host Tools
      run: |
        echo "🔨 Building TDLib host tools..."
        cd $GITHUB_WORKSPACE
        mkdir -p build-host
        cd build-host

        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENSSL_ROOT_DIR=$HOME/openssl-macos \
          $GITHUB_WORKSPACE

        ninja -j4

        echo "✅ Host tools built successfully"
        echo "📊 Generated files:"
        ls -lh td/generate/auto/td/telegram/td_api_*.cpp || echo "Warning: td_api files may be in different location"
        ls -lh tdutils/generate/auto/*.cpp || echo "Warning: tdutils files may be in different location"

    - name: Build OpenSSL for Android ARM64
      run: |
        echo "🔐 Building OpenSSL 3.0.15 for Android ARM64..."
        cd ~

        # Clean previous build
        rm -rf openssl-3.0.15
        tar -xzf openssl.tar.gz
        cd openssl-3.0.15

        export ANDROID_NDK_ROOT=$HOME/android-ndk-r26c
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-x86_64/bin:$PATH

        ./Configure android-arm64 \
          -D__ANDROID_API__=21 \
          --prefix=$HOME/openssl-android-arm64 \
          no-shared \
          no-tests

        make -j4
        make install_sw

        echo "✅ OpenSSL for Android ARM64 built"
        ls -lh $HOME/openssl-android-arm64/lib/

    - name: Export OpenSSL path for build
      run: |
        echo "OPENSSL_ANDROID_ARM64=$HOME/openssl-android-arm64" >> $GITHUB_ENV
        echo "✅ OpenSSL path exported: $OPENSSL_ANDROID_ARM64"
        echo "📂 OpenSSL lib directory: $OPENSSL_ANDROID_ARM64/lib"
        echo "📋 Listing OpenSSL libraries:"
        ls -lh $OPENSSL_ANDROID_ARM64/lib/*.a

    - name: Build TDLib for Android ARM64
      run: |
        echo "🎯 Building TDLib for Android arm64-v8a with JSON interface..."
        cd $GITHUB_WORKSPACE
        mkdir -p build-android
        cd build-android

        # Use JSON interface (-DTD_ANDROID_JSON=ON) which is stable and maintained
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
          -DOPENSSL_ROOT_DIR=$OPENSSL_ANDROID_ARM64 \
          -DOPENSSL_INCLUDE_DIR=$OPENSSL_ANDROID_ARM64/include \
          -DOPENSSL_CRYPTO_LIBRARY=$OPENSSL_ANDROID_ARM64/lib/libcrypto.a \
          -DOPENSSL_SSL_LIBRARY=$OPENSSL_ANDROID_ARM64/lib/libssl.a \
          -DTD_ANDROID_JSON=ON \
          $GITHUB_WORKSPACE/example/android

        echo ""
        echo "📋 CMake configuration complete. Building..."
        echo ""

        echo "Available targets:"
        ninja -t targets 2>/dev/null | grep -i "td" | head -20 || echo "Target listing not available"
        echo ""

        echo "🔍 Building TDLib..."
        ninja -j4

        echo "✅ TDLib Android build complete"
        echo "📦 Built libraries:"
        find . -name "*.so" -o -name "*.a" | grep -E "libtd|tdjson" | xargs ls -lh

    - name: Verify libtdjson.so
      run: |
        echo "📊 Verifying libtdjson.so..."
        cd build-android

        # Find libtdjson.so location
        TDJSON_PATH=$(find . -name "libtdjson.so" | head -n 1)

        if [ -n "$TDJSON_PATH" ]; then
          echo "✅ libtdjson.so found at: $TDJSON_PATH"
          echo ""
          echo "📏 File details:"
          ls -lh "$TDJSON_PATH"
          echo ""
          echo "🔍 File type:"
          file "$TDJSON_PATH"
          echo ""

          if file "$TDJSON_PATH" | grep -q "ARM aarch64"; then
            echo "✅ Correct architecture: ARM64 (aarch64)"
          else
            echo "❌ Wrong architecture detected!"
            exit 1
          fi

          if file "$TDJSON_PATH" | grep -q "shared object"; then
            echo "✅ Correct file type: Shared library"
          else
            echo "❌ Not a shared library!"
            exit 1
          fi

          echo ""
          echo "🎉 Build verification successful!"
          echo "libtdjson.so ready for download"

          # Copy to root for easier artifact upload
          cp "$TDJSON_PATH" ./libtdjson.so
        else
          echo "❌ libtdjson.so not found!"
          echo "Build directory contents:"
          find . -type f -name "*.so" || echo "No .so files found"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdlib-android-arm64
        path: build-android/libtdjson.so
        retention-days: 7

    - name: Build summary
      run: |
        echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifact Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **File:** libtdjson.so (JSON interface)" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture:** ARM64 (aarch64)" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Android API 21+" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type:** Release" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download:" >> $GITHUB_STEP_SUMMARY
        echo "Go to Actions → This workflow run → Artifacts section" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cd build-android
        FILE_SIZE=$(ls -lh libtdjson.so | awk '{print $5}')
        echo "- **File Size:** $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
